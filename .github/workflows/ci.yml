name: ci

# Checks every push and pull request on the pinned Engine pair: Core and CLI
# tests, the Game build, and validation of every first-party module. The
# Blackapple Brugh campaign repository is cloned beside this one for its
# regression tests and workspace build.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rusty-goldbox
    env:
      GOLDBOX_BLACKAPPLE: ${{ github.workspace }}/blackapple-brugh
    steps:
      - uses: actions/checkout@v4
        with:
          path: rusty-goldbox

      - uses: actions/checkout@v4
        with:
          repository: FuzzySlipper/blackapple-brugh
          path: blackapple-brugh

      # The campaign's art is in Git LFS. Cache the objects so each run
      # doesn't spend LFS bandwidth downloading the same pictures again.
      - name: List the campaign's LFS objects
        working-directory: blackapple-brugh
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > ../.lfs-ids
      - uses: actions/cache@v4
        with:
          path: blackapple-brugh/.git/lfs
          key: lfs-${{ hashFiles('.lfs-ids') }}
          restore-keys: lfs-
      - name: Get the campaign's LFS objects
        working-directory: blackapple-brugh
        run: git lfs pull

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Get rusty and the pinned pair
        run: |
          curl -fsSL https://raw.githubusercontent.com/FuzzySlipper/rusty-engine/main/scripts/install-rusty.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/rusty" install

      - name: Test
        run: dotnet test tests/RustyGoldbox.Tests

      - name: Check the browser UI modules
        run: |
          for module in $(find src/ui -name '*.js'); do
            node --input-type=module --check < "$module"
          done

      - name: Build the Game
        run: rusty build --project src/RustyGoldbox.Game/RustyGoldbox.Game.csproj

      - name: Validate first-party modules
        run: |
          shopt -s nullglob
          status=0
          for manifest in modules/*/module.json; do
            module=$(dirname "$manifest")
            dotnet run --project src/RustyGoldbox.Cli -- module validate "$module" || status=1
          done
          exit $status

      - name: Build the Blackapple campaign workspace
        run: dotnet run --project src/RustyGoldbox.Cli -- workspace build ../blackapple-brugh --json
